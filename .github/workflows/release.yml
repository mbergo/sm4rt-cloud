name: release

# Pushes ghcr.io/<owner>/floci-cloud on every main push (latest + sha)
# and on tags (semver). Public image — installers pull without credentials.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/floci-cloud"
          {
            echo "tags<<EOF"
            echo "${img}:sha-${GITHUB_SHA::12}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "${img}:${GITHUB_REF_NAME#v}"
            fi
            echo "${img}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=floci-cloud
            org.opencontainers.image.description=Self-hosted AWS-compatible cloud console and provisioner
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
