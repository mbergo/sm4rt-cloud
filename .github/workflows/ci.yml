name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            ui/package-lock.json
      - name: install api deps
        run: npm ci
        working-directory: api
      - name: typecheck api + tests
        run: >
          npx -y -p typescript@5.7.2 tsc --noEmit --allowImportingTsExtensions
          --module nodenext --target es2022 --moduleResolution nodenext --skipLibCheck
          src/server.ts src/k8s.ts src/resources.ts src/services.ts
          tests/names.test.ts tests/resources.test.ts tests/e2e-kind.test.ts tests/json-body.test.ts tests/domains.test.ts
          tests/services.test.ts
        working-directory: api
      - name: unit tests (names)
        run: node --test tests/names.test.ts
        working-directory: api
      - name: unit tests (json body parser)
        run: node --test tests/json-body.test.ts
        working-directory: api
      - name: unit tests (domains)
        run: node --test tests/domains.test.ts
        working-directory: api
      - name: unit tests (service catalog)
        run: node --test tests/services.test.ts
        working-directory: api
      - name: install ui deps
        run: npm ci
        working-directory: ui
      - name: build ui
        run: npm run build
        working-directory: ui
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k

  swarm-auth-e2e:
    name: swarm-auth-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: init docker swarm
        run: docker swarm init
      - name: install api deps
        run: npm ci
        working-directory: api
      - name: capacity accounting against the real swarm
        # Exercises SwarmDriver against a live daemon rather than a copy of its
        # logic, so a change in what docker returns fails here.
        run: node --test --test-reporter spec tests/capacity-swarm.test.ts
        working-directory: api
        env:
          RUN_SWARM: '1'
      - name: start API (clerk mode + FLOCI_CLOUD_TOKEN backdoor)
        working-directory: api
        env:
          DRIVER: swarm
          INSTANCE_DOMAIN: localhost
          PORT: '8080'
          CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_CLERK_PUBLISHABLE_KEY }}
        run: |
          FLOCI_CLOUD_TOKEN="${{ secrets.CI_FLOCI_CLOUD_TOKEN }}"
          echo "FLOCI_CLOUD_TOKEN=$FLOCI_CLOUD_TOKEN" >> "$GITHUB_ENV"
          FLOCI_CLOUD_TOKEN=$FLOCI_CLOUD_TOKEN nohup npm start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz > /dev/null
      - name: assert authMode is clerk (people still see Clerk)
        run: |
          mode=$(curl -sf http://127.0.0.1:8080/api/public/config | node -pe 'JSON.parse(require("fs").readFileSync(0)).authMode')
          test "$mode" = "clerk"
      - name: assert unauthenticated request is rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/instances)
          test "$code" = "401"
      - name: assert FLOCI_CLOUD_TOKEN backdoor grants access
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${FLOCI_CLOUD_TOKEN}" http://127.0.0.1:8080/api/instances)
          test "$code" = "200"
      - name: api logs
        if: always()
        run: cat /tmp/api.log || true
      - name: stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  swarm-smoke:
    # Deploys real catalog services and console features on a live swarm and
    # checks each one answers, through the same API and edge proxy an install
    # uses. A subset runs here to keep the job short; the scripts cover the
    # whole catalog when run without --only (see e2e/smoke/).
    name: swarm-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: init docker swarm
        run: docker swarm init
      - name: install api deps
        run: npm ci
        working-directory: api
      - name: start API (token mode)
        working-directory: api
        env:
          DRIVER: swarm
          INSTANCE_DOMAIN: localhost
          PORT: '8080'
          FLOCI_CLOUD_TOKEN: smoke
        run: |
          nohup npm start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz > /dev/null
      - name: create workspace and edge proxy
        run: |
          curl -sf -X POST -H 'Authorization: Bearer smoke' -H 'content-type: application/json' \
            -d '{"name":"smoke"}' http://127.0.0.1:8080/api/instances > /dev/null
          docker service create --name caddy --network floci-net \
            --publish published=80,target=80,mode=host \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock,ro \
            --env CADDY_INGRESS_NETWORKS=floci-net --env CADDY_DOCKER_POLLING_INTERVAL=5s \
            lucaslorentz/caddy-docker-proxy:2.13.1-alpine > /dev/null
          for i in $(seq 1 90); do
            status=$(curl -sf -H 'Authorization: Bearer smoke' http://127.0.0.1:8080/api/instances/smoke \
              | node -pe 'JSON.parse(require("fs").readFileSync(0)).status' || true)
            [ "$status" = "running" ] && break
            sleep 2
          done
          test "$status" = "running"
      - name: catalog smoke (deploy, function, console panel, stop)
        run: >
          node e2e/smoke/catalog-smoke.mjs --token smoke --edge http://127.0.0.1
          --only httpd,zookeeper,couchdb,kafka,cassandra
      - name: compute smoke (container, cache, gateway, dns, cdn, function)
        run: >
          node e2e/smoke/compute-smoke.mjs --token smoke --edge http://127.0.0.1
          --only container,cache,gateway,dns,cdn,function
      - name: api logs
        if: always()
        run: cat /tmp/api.log || true
      - name: swarm state on failure
        if: failure()
        run: |
          docker service ls
          docker service ps --no-trunc $(docker service ls -q) | head -60

  kind-e2e:
    name: kind-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: floci-ci
      - name: preload emulator image into kind
        run: |
          docker pull floci/floci:latest
          # floci/floci is published multi-platform. Docker's containerd image
          # store exports the whole index, including platforms it never
          # pulled, and kind's import then fails on the missing blobs
          # ("content digest ... not found"). Export only the runner's own
          # platform and load that archive instead.
          docker save --platform linux/amd64 floci/floci:latest -o /tmp/floci.tar
          kind load image-archive /tmp/floci.tar --name floci-ci
      - name: install api deps
        run: npm ci
        working-directory: api
      - name: e2e — provision instance, S3 roundtrip, service start/stop, reaper
        run: node --test --test-reporter spec --test-concurrency 1 tests/e2e-kind.test.ts
        working-directory: api
        env:
          RUN_KIND: '1'
      - name: debug cluster state on failure
        if: failure()
        run: |
          kubectl get ns
          kubectl get pods -A -o wide
          for ns in $(kubectl get ns -o name | grep floci-i- | cut -d/ -f2); do
            echo "--- $ns"
            kubectl -n "$ns" describe pods | tail -60
            kubectl -n "$ns" logs deploy/floci --tail=50 || true
          done
