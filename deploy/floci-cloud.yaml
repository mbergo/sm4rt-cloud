apiVersion: v1
kind: ServiceAccount
metadata:
  name: floci-cloud
  namespace: floci-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: floci-cloud-provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: floci-cloud-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: floci-cloud-provisioner
subjects:
  - kind: ServiceAccount
    name: floci-cloud
    namespace: floci-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-cloud
  namespace: floci-cloud
  labels:
    app: floci-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floci-cloud
  template:
    metadata:
      labels:
        app: floci-cloud
    spec:
      serviceAccountName: floci-cloud
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: floci-cloud
          image: aiready.azurecr.io/floci-cloud:v9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: INSTANCE_DOMAIN
              value: "floci.sm4rtworks.com"
            - name: INSTANCE_TLS
              value: "true"
            - name: CLUSTER_ISSUER
              value: "letsencrypt"
            - name: GATEWAY_NAME
              value: "floci"
            - name: GATEWAY_NAMESPACE
              value: "envoy-gateway-system"
            - name: FLOCI_IMAGE
              value: "aiready.azurecr.io/floci:duckfix"
            - name: INGRESS_CLASS
              value: "nginx"
            - name: FLOCI_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: floci-cloud-auth
                  key: token
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: floci-cloud-clerk
                  key: secret-key
                  optional: true
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: floci-cloud-clerk
                  key: publishable-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: floci-cloud
  namespace: floci-cloud
  labels:
    app: floci-cloud
spec:
  selector:
    app: floci-cloud
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: floci-cloud
  namespace: floci-cloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cloud.sm4rt.works
      secretName: floci-cloud-tls
  rules:
    - host: cloud.sm4rt.works
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: floci-cloud
                port:
                  number: 80
