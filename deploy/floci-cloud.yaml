apiVersion: v1
kind: ServiceAccount
metadata:
  name: floci-cloud
  namespace: floci-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: floci-cloud-provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: floci-cloud-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: floci-cloud-provisioner
subjects:
  - kind: ServiceAccount
    name: floci-cloud
    namespace: floci-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-cloud
  namespace: floci-cloud
  labels:
    app: floci-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floci-cloud
  template:
    metadata:
      labels:
        app: floci-cloud
    spec:
      serviceAccountName: floci-cloud
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: floci-cloud
          image: aiready.azurecr.io/floci-cloud:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: INSTANCE_DOMAIN
              value: "floci.172.170.57.92.nip.io"
            - name: FLOCI_IMAGE
              value: "floci/floci:latest"
            - name: INGRESS_CLASS
              value: "nginx"
            - name: FLOCI_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: floci-cloud-auth
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: floci-cloud
  namespace: floci-cloud
  labels:
    app: floci-cloud
spec:
  selector:
    app: floci-cloud
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: floci-cloud
  namespace: floci-cloud
spec:
  ingressClassName: nginx
  rules:
    - host: floci-cloud.172.170.57.92.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: floci-cloud
                port:
                  number: 80
