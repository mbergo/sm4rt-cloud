# Envoy Gateway infrastructure for *.floci.sm4rtworks.com
# Prereqs (one-time, done via helm/az):
#   helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.3.2 -n envoy-gateway-system --create-namespace
#   az role assignment create --assignee <kubelet-objectId> --role "DNS Zone Contributor" \
#     --scope /subscriptions/30f5d7ee-3f24-4dac-a2f8-05d207931847/resourceGroups/infra001-rg/providers/Microsoft.Network/dnszones/sm4rtworks.com
#   A record: *.floci.sm4rtworks.com -> Envoy LB IP
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: floci
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.floci.sm4rtworks.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.floci.sm4rtworks.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: floci-wildcard-tls
---
# Wildcard cert via DNS-01 against Azure DNS using the AKS kubelet managed identity (IMDS).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@aiready.io
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: 30f5d7ee-3f24-4dac-a2f8-05d207931847
            resourceGroupName: infra001-rg
            hostedZoneName: sm4rtworks.com
            environment: AzurePublicCloud
            managedIdentity:
              clientID: d6fda4d1-59de-44b4-92fe-32299b5c6746
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: floci-wildcard
  namespace: envoy-gateway-system
spec:
  secretName: floci-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
  commonName: "*.floci.sm4rtworks.com"
  dnsNames:
    - "*.floci.sm4rtworks.com"
